<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
  <!-- Dell Logo - Modern circular mark with wordmark -->
  <g transform="translate(75, 75)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="52" fill="none" stroke="#007DB8" stroke-width="4.5"/>
    <!-- Inner DELL text (tilted E is signature Dell style) -->
    <text x="0" y="8" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="bold" font-size="40" fill="#007DB8" letter-spacing="2">DELL</text>
  </g>
  <!-- Technologies wordmark -->
  <text x="155" y="84" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="42" fill="#007DB8" letter-spacing="1">Technologies</text>
</svg>